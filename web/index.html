<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cognitive Dynamics Engine</title>
<script src="/web/cytoscape.min.js"></script>
<style>
  :root {
    --bg:#0d1117; --panel:#161b22; --border:#30363d; --fg:#e6edf3; --dim:#8b949e;
    --accent:#f0883e; --blue:#58a6ff; --green:#3fb950; --grey:#6e7681; --red:#f85149;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:13px/1.45 -apple-system,"Segoe UI",Roboto,sans-serif; height:100vh; display:flex; flex-direction:column; }
  header { padding:8px 14px; background:var(--panel); border-bottom:1px solid var(--border); display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:15px; margin:0; font-weight:600; }
  header .stats { color:var(--dim); font-size:12px; }
  .daybtns button, .tgl, .zoombtn, .lensbtn { background:#21262d; color:var(--fg); border:1px solid var(--border); border-radius:6px; padding:3px 9px; margin-right:4px; cursor:pointer; font-size:12px; }
  .daybtns button.on, .lensbtn.on { background:var(--blue); border-color:var(--blue); color:#0d1117; font-weight:600; }
  #crumb { color:var(--blue); cursor:pointer; font-size:12px; display:none; }
  #crumb:hover { text-decoration:underline; }
  .tgl.on { background:var(--accent); border-color:var(--accent); color:#0d1117; }
  #search { background:#21262d; border:1px solid var(--border); color:var(--fg); border-radius:6px; padding:4px 8px; width:200px; }
  main { flex:1; display:flex; min-height:0; }
  #cy { flex:1; min-width:0; }
  #inspector { width:380px; background:var(--panel); border-left:1px solid var(--border); overflow-y:auto; padding:12px; }
  #inspector h2 { font-size:14px; margin:0 0 4px; }
  #inspector .meta { color:var(--dim); margin-bottom:8px; }
  #inspector h3 { font-size:12px; color:var(--dim); text-transform:uppercase; letter-spacing:.06em; margin:14px 0 4px; }
  .utt { padding:3px 6px; border-left:2px solid var(--border); margin:3px 0; font-size:12px; }
  .utt .zh { color:var(--dim); display:block; }
  .utt b { color:var(--blue); font-weight:500; }
  .edgecard { border:1px solid var(--border); border-radius:6px; padding:6px 8px; margin:6px 0; font-size:12px; cursor:pointer; }
  .edgecard:hover { border-color:var(--blue); }
  .edgecard .rel { font-weight:700; }
  .edgecard .rat { color:var(--dim); margin-top:2px; }
  .edgecard .alts { color:var(--dim); font-style:italic; margin-top:2px; }
  .edgecard .ev { color:var(--green); margin-top:2px; }
  .mention { font-size:12px; margin:3px 0; }
  .mention .tag { display:inline-block; font-size:10px; padding:0 5px; border-radius:4px; background:#21262d; color:var(--blue); margin-right:5px; }
  #tracebtn { width:100%; margin-top:10px; padding:7px; background:var(--accent); color:#0d1117; border:none; border-radius:6px; font-weight:700; cursor:pointer; font-size:13px; }
  #playev { width:100%; margin-top:6px; padding:7px; background:#21262d; color:var(--blue); border:1px solid var(--border); border-radius:6px; font-weight:700; cursor:pointer; font-size:13px; }
  .playbtn { background:none; border:none; color:var(--blue); cursor:pointer; font-size:11px; padding:0 5px 0 0; }
  .playbtn:hover { color:var(--accent); }
  .utt.playing, .chainhop .q.playing { border-left-color:var(--accent); background:#1c2128; }
  #legend { position:absolute; left:12px; bottom:12px; background:rgba(22,27,34,.94); border:1px solid var(--border); border-radius:8px; padding:8px 12px; font-size:11px; z-index:10; max-width:300px; }
  #legend .sw { display:inline-block; width:26px; height:0; border-top:3px solid; margin:0 6px 2px 0; vertical-align:middle; }
  #goalbar, #peoplebar { display:flex; gap:6px; overflow-x:auto; padding:6px 14px; background:var(--panel); border-bottom:1px solid var(--border); font-size:12px; }
  .goalchip, .personchip { background:#21262d; border:1px solid var(--border); border-radius:14px; padding:2px 10px; cursor:pointer; white-space:nowrap; }
  .goalchip:hover { border-color:var(--accent); }
  .personchip:hover { border-color:#39c5cf; }
  .personchip .pn { color:#39c5cf; font-size:10px; margin-left:4px; }
  .dayrow { color:var(--dim); font-size:11px; margin-top:3px; }
  .dayrow b { color:var(--fg); font-weight:500; }
  .evlink { color:var(--blue); cursor:pointer; margin-right:5px; }
  .evlink:hover { text-decoration:underline; }
  .chainhop { border-left:3px solid var(--accent); padding:4px 8px; margin:8px 0; font-size:12px; background:#1c2128; border-radius:0 6px 6px 0; }
  .chainhop .r { color:var(--accent); font-weight:700; }
  .chainhop .q { color:var(--dim); margin-top:2px; }
  #searchres { position:absolute; top:52px; right:392px; background:var(--panel); border:1px solid var(--border); border-radius:8px; z-index:20; max-width:420px; max-height:50vh; overflow-y:auto; display:none; }
  #searchres div { padding:6px 10px; cursor:pointer; border-bottom:1px solid var(--border); font-size:12px; }
  #searchres div:hover { background:#21262d; }
  .recount { color:var(--red); }
</style>
</head>
<body>
<header>
  <h1>Cognitive Dynamics Engine</h1>
  <span class="stats" id="stats">loading…</span>
  <span id="lensbtns">
    <button class="lensbtn on" data-l="themes">themes</button>
    <button class="lensbtn" data-l="causal">causal</button>
    <button class="lensbtn" data-l="all">all</button>
  </span>
  <span id="crumb"></span>
  <span class="daybtns" id="daybtns"></span>
  <button class="tgl" id="tglsim">similarity</button>
  <button class="tgl" id="tglrej">rejected</button>
  <button class="tgl" id="btnreplay">▶ replay</button>
  <input id="scrub" type="range" min="0" max="168" step="0.25" value="0" style="width:160px;display:none">
  <button class="tgl" id="btnspeed" style="display:none">1×</button>
  <span id="clock" style="color:var(--dim);font-size:12px;min-width:170px"></span>
  <span id="zoombtns">
    <button class="zoombtn" data-z="week">week</button>
    <button class="zoombtn" data-z="day">day</button>
    <button class="zoombtn" data-z="hour">hour</button>
  </span>
  <button class="tgl" id="btninsights">insights</button>
  <input id="search" placeholder="semantic search…">
  <a href="/web/trends.html" style="color:#58a6ff;font-size:12px;text-decoration:none">social graph →</a>
</header>
<div id="goalbar"></div>
<div id="peoplebar"></div>
<main>
  <div id="cy"></div>
  <div id="inspector"><p style="color:var(--dim)">Click a node to inspect its evidence.</p></div>
</main>
<div id="searchres"></div>
<div id="legend">
  <b>edges</b><br>
  <span class="sw" style="border-color:#6e7681"></span>PRECEDES (order)<br>
  <span class="sw" style="border-color:#58a6ff"></span>SAME_THREAD / REFERS_TO<br>
  <span class="sw" style="border-color:#f0883e"></span>INFLUENCES (hypothesis, width=confidence)<br>
  <span class="sw" style="border-color:#3fb950;border-top-style:dotted"></span>SIMILAR_TO — semantic only<br>
  <span class="sw" style="border-color:#f85149;border-top-style:dashed"></span>rejected candidate<br>
  <span class="sw" style="border-color:#bc8cff"></span>ADVANCES_GOAL<br>
  <span class="sw" style="border-color:#39c5cf"></span>INTERACTION_PATTERN (people bar)
</div>
<script>
const $ = s => document.querySelector(s);
let cy, curDays = "1-7", showSim = false, showRej = false, zoomLevel = "week";
let lastData = null;
let lens = "themes", curTheme = null, lastThemes = null, lastLinks = null;

async function api(p) { const r = await fetch(p); return r.json(); }

// ---------- audio playback of original EgoLife audio ----------
let audioOK = false, player = new Audio(), curBtn = null, queue = [];
async function checkAudio() {
  try { const s = await api("/api/audio/status"); audioOK = !!s.available; } catch(e) {}
}
function haltCurrent() {   // stop the playing clip only — the queue survives
  player.pause();
  player.removeAttribute("src"); player.load();
  if (curBtn) { curBtn.textContent = "▶"; curBtn.closest(".utt,.q")?.classList.remove("playing"); curBtn = null; }
}
function stopAudio() { haltCurrent(); queue = []; }   // stop clip + clear queue
function playUtt(uid, btn) {
  if (curBtn === btn && btn && !player.paused) { stopAudio(); return; }
  haltCurrent(); queue = queue.filter(q => q !== uid);   // queued clips still play after this one
  player.src = `/api/audio/${uid}`;
  player.play().catch(() => {});
  curBtn = btn;
  if (btn) { btn.textContent = "⏸"; btn.closest(".utt,.q")?.classList.add("playing"); }
}
player.onended = player.onerror = () => {
  const nxt = queue.shift();
  if (curBtn) { curBtn.textContent = "▶"; curBtn.closest(".utt,.q")?.classList.remove("playing"); curBtn = null; }
  if (nxt != null) playUtt(nxt, document.querySelector(`.playbtn[data-uid="${nxt}"]`));
};
async function playEvent(eid) {
  const d = await api(`/api/audio/event/${eid}`);
  if (!d.clips || !d.clips.length) return;
  stopAudio();
  queue = d.clips.map(c => c.uid);
  const first = queue.shift();
  playUtt(first, document.querySelector(`.playbtn[data-uid="${first}"]`));
}
function bindPlayButtons(root) {
  if (!audioOK) return;
  root.querySelectorAll(".playbtn").forEach(b =>
    b.onclick = ev => { ev.stopPropagation(); playUtt(+b.dataset.uid, b); });
}
const pbtn = u => audioOK ? `<button class="playbtn" data-uid="${u}">▶</button>` : "";

async function loadStats() {
  await checkAudio();
  const s = await api("/api/stats");
  $("#stats").textContent =
    `${s.nodes.utterances} utterances · ${s.nodes.events} events · ` +
    `${s.nodes.goals||0} goals · backend=${s.llm_backend} · ` +
    `grounded edges ${s.grounding.with_evidence}/${s.grounding.judged_edges}` +
    (s.grounding.pct!=null ? ` (${s.grounding.pct}%)` : "");
}

function dayButtons() {
  const box = $("#daybtns");
  box.innerHTML = "";
  const all = document.createElement("button");
  all.textContent = "All"; all.dataset.d = "1-7"; box.appendChild(all);
  for (let d = 1; d <= 7; d++) {
    const b = document.createElement("button");
    b.textContent = "D" + d; b.dataset.d = String(d); box.appendChild(b);
  }
  box.querySelectorAll("button").forEach(b => b.onclick = () => {
    curDays = b.dataset.d; loadGraph();
  });
}

function pxPerSec() { return {week: 0.010, day: 0.12, hour: 1.2}[zoomLevel]; }

function buildElements(data) {
  const els = [];
  const lo = data.nodes.length ? Math.min(...data.nodes.map(n => n.t)) : 0;
  const lanes = {GOAL: 0, EVENT: 1};
  let laneRow = {};
  for (const n of data.nodes) {
    const lane = lanes[n.type] ?? 1;
    laneRow[lane] = laneRow[lane] || 0;
    const x = (n.t - lo) * pxPerSec();
    const jitter = ((n.id.charCodeAt(1) * 7919) % 40);
    const y = lane === 0 ? -140 + jitter : laneRow[lane]++ * 34 + jitter;
    els.push({data: {id: n.id, label: n.label, type: n.type, mood: n.mood,
                     day: n.day, recount: n.recount, days: n.days, states: n.states,
                     t: n.t, mass: 0},
              position: {x, y}});
  }
  for (const e of data.edges) {
    els.push({data: {id: e.id, source: e.src, target: e.dst, relation: e.relation,
                     status: e.status, confidence: e.confidence,
                     evidence_type: e.evidence_type, rationale: e.rationale, score: e.score}});
  }
  return els;
}

const moodColor = m => ({
  playful:"#d2a8ff", cheerful:"#3fb950", focused:"#58a6ff", humorous:"#e3b341",
  enthusiastic:"#f0883e", impressed:"#79c0ff", warm:"#ffa198", amused:"#d2a8ff",
  lighthearted:"#7ee787", lively:"#ffa657", casual:"#8b949e", calm:"#8b949e",
}[m] || "#9fb3c8");

const style = [
  {selector: 'node[type="EVENT"]', style: {
    'background-color': n => moodColor(n.data('mood')),
    'width': n => 10 + 2.2 * (n.data('mass') || 0), 'height': n => 10 + 2.2 * (n.data('mass') || 0),
    'border-width': n => n.data('recount') ? 2 : 0, 'border-color': '#f85149',
    'label': '', 'font-size': 9, 'transition-property': 'width height opacity',
    'transition-duration': '0.25s'}},
  {selector: 'node[type="GOAL"]', style: {
    'shape': 'diamond', 'background-color': '#bc8cff',
    'width': n => 16 + 4 * (n.data('mass') || 0), 'height': n => 16 + 4 * (n.data('mass') || 0),
    'label': 'data(label)', 'font-size': 10, 'color': '#e6edf3',
    'text-valign': 'bottom', 'text-margin-y': 4, 'text-max-width': '160px',
    'text-wrap': 'wrap', 'transition-property': 'width height',
    'transition-duration': '0.3s'}},
  {selector: 'edge', style: {'curve-style': 'bezier', 'target-arrow-shape': 'triangle',
    'arrow-scale': 0.7, 'opacity': 0.85}},
  {selector: 'edge[relation="PRECEDES"]', style: {'line-color': '#6e7681', 'width': 1,
    'target-arrow-fill': '#6e7681', 'opacity': 0.4}},
  {selector: 'edge[relation="SIMILAR_TO"]', style: {'line-color': '#3fb950', 'width': 1.2,
    'line-style': 'dotted', 'target-arrow-fill': '#3fb950', 'opacity': 0.5,
    'label': '', 'display': 'none'}},
  {selector: 'edge[relation="SAME_THREAD"]', style: {'line-color': '#58a6ff',
    'width': e => 1.6 + 0.9 * (e.data('w') || 0),
    'target-arrow-fill': '#58a6ff', 'opacity': 0.65}},
  {selector: 'edge[relation="SIMILAR_TO"].replay-sim', style: {'display': 'element'}},
  {selector: 'edge[relation="REFERS_TO"]', style: {'line-color': '#58a6ff', 'width': 2.2,
    'line-style': 'solid', 'target-arrow-fill': '#58a6ff'}},
  {selector: 'edge[relation="INFLUENCES"]', style: {
    'line-color': '#f0883e', 'width': e => 1 + 3 * (e.data('confidence') || 0.5),
    'target-arrow-fill': '#f0883e',
    'line-style': e => e.data('evidence_type') === 'self_report' ? 'solid' : 'dashed'}},
  {selector: 'edge[relation="ADVANCES_GOAL"]', style: {'line-color': '#bc8cff', 'width': 1.4,
    'target-arrow-fill': '#bc8cff', 'opacity': 0.6, 'line-style': 'dashed'}},
  {selector: 'edge[status="rejected"]', style: {'line-color': '#f85149', 'width': 1,
    'line-style': 'dashed', 'opacity': 0.35, 'display': 'none'}},
  {selector: 'node[type="BANDLABEL"]', style: {
    'background-opacity': 0, 'border-width': 0, 'label': 'data(label)',
    'color': '#8b949e', 'font-size': 11, 'font-weight': 700,
    'text-halign': 'left', 'text-valign': 'center', 'events': 'no',
    'width': 160, 'height': 24}},
  {selector: 'node[type="THEME"]', style: {
    'shape': 'ellipse',
    'background-color': n => n.data('kind') === 'social' ? '#39c5cf' : '#58a6ff',
    'background-opacity': 0.18,
    'border-width': 2,
    'border-color': n => n.data('kind') === 'social' ? '#39c5cf' : '#58a6ff',
    'width': n => 30 + 9 * Math.sqrt(n.data('n_events') || 1),
    'height': n => 30 + 9 * Math.sqrt(n.data('n_events') || 1),
    'label': 'data(label)', 'font-size': 12, 'font-weight': 600, 'color': '#e6edf3',
    'text-valign': 'center', 'text-wrap': 'wrap', 'text-max-width': '150px'}},
  {selector: 'node.stub', style: {
    'shape': 'round-rectangle', 'background-color': '#21262d',
    'background-opacity': 1, 'border-color': '#6e7681',
    'width': 96, 'height': 36, 'font-size': 9, 'font-weight': 400,
    'text-max-width': '90px'}},
  {selector: 'edge[relation="THEME_LINK"]', style: {
    'line-color': e => (e.data('infl') || 0) > 0 ? '#f0883e' : '#58a6ff',
    'target-arrow-fill': e => (e.data('infl') || 0) > 0 ? '#f0883e' : '#58a6ff',
    'width': e => 1 + 2.5 * Math.log(1 + (e.data('n') || 1)),
    'label': 'data(n)', 'font-size': 9, 'color': '#8b949e',
    'text-rotation': 'autorotate', 'opacity': 0.8}},
  {selector: 'edge[relation="CROSS_THEME"]', style: {
    'line-color': '#6e7681', 'target-arrow-fill': '#6e7681',
    'line-style': 'dashed', 'width': e => 1 + Math.log(1 + (e.data('n') || 1)),
    'opacity': 0.45}},
  {selector: '.chain', style: {'line-color': '#ffd33d', 'target-arrow-fill': '#ffd33d',
    'width': 4, 'opacity': 1, 'z-index': 99}},
  {selector: 'node.chain', style: {'border-width': 3, 'border-color': '#ffd33d'}},
];

function dayRange() {
  if (curDays.includes("-")) {
    const [a, b] = curDays.split("-", 2).map(Number);
    return [a, b];
  }
  const d = +curDays;
  return [d, d];
}

async function loadGraph() {
  document.querySelectorAll("#daybtns button").forEach(b =>
    b.classList.toggle("on", b.dataset.d === curDays));
  if (lens === "themes") return loadThemes();
  if (lens === "causal") return loadTheme();
  const d = await api(`/api/graph?subject=A1_JAKE&days=${curDays}`);
  lastData = d;
  const els = buildElements(d);
  if (cy) cy.destroy();
  cy = cytoscape({container: $("#cy"), elements: els, style,
    wheelSensitivity: 0.3, minZoom: 0.05, maxZoom: 4});
  cy.fit(undefined, 40);
  cy.on('tap', 'node[type="EVENT"]', ev => inspect(ev.target.data('id').slice(1)));
  cy.on('tap', 'node[type="GOAL"]', ev => showGoal(ev.target.data('id').slice(1)));
  updateVisibility();
  loadGoalBar();
}

function updateVisibility() {
  if (!cy) return;
  cy.edges('[relation="SIMILAR_TO"]').style('display', showSim ? 'element' : 'none');
  cy.edges('[status="rejected"]').style('display', showRej ? 'element' : 'none');
}

async function inspect(eid) {
  stopAudio();
  const e = await api(`/api/event/${eid}`);
  const insp = $("#inspector");
  const utts = e.utterances.map(u =>
    `<div class="utt">${pbtn(u.id)}<b>${u.hms} ${u.speaker}</b> ${u.text_en || ""}` +
    (u.text_zh ? `<span class="zh">${u.text_zh}</span>` : "") + `</div>`).join("");
  const men = e.mentions.map(m =>
    `<div class="mention"><span class="tag">${m.type}</span>${m.speaker}: ${m.text}` +
    (m.evidence.length ? ` <span style="color:var(--green)">[u${m.evidence.join(",u")}]</span>` : "") +
    `</div>`).join("");
  const edgeCard = r => {
    const other = `e${r.other_id}`;
    const rel = r.relation;
    const cls = rel === "INFLUENCES" ? "var(--accent)" :
                rel === "SIMILAR_TO" ? "var(--green)" :
                r.status === "rejected" ? "var(--red)" : "var(--blue)";
    return `<div class="edgecard" data-node="${other}">
      <span class="rel" style="color:${cls}">${r.direction === "out" ? "→" : "←"} ${rel}</span>
      <span style="color:var(--dim)"> ${r.status}${r.confidence != null ? " · conf " + (+r.confidence).toFixed(2) : ""}${r.evidence_type ? " · " + r.evidence_type : ""}${r.retrieval_score ? " · S=" + r.retrieval_score : ""}</span>
      ${r.rationale ? `<div class="rat">${r.rationale}</div>` : ""}
      ${r.alternatives && r.alternatives.length ? `<div class="alts">alt: ${r.alternatives.join(" / ")}</div>` : ""}
      ${r.evidence_utterances.length ? `<div class="ev">evidence: u${r.evidence_utterances.join(", u")}</div>` : ""}
    </div>`;
  };
  insp.innerHTML = `
    <h2>${e.summary}</h2>
    <div class="meta">day ${e.day} · ${e.hms} · mood: ${e.mood || "—"}
      ${e.time_uncertain ? ' · <span class="recount">recounts earlier time</span>' : ""}
      ${e.occurred_at !== e.recorded_at ? `<br>occurred: day ${Math.floor(e.occurred_at / 86400) + 1} (recorded day ${e.day})` : ""}
    </div>
    <div class="meta">who: ${e.participants.join(", ") || "—"} · topics: ${e.topics.join(", ") || "—"}
      ${e.goals.length ? `<br>goals: ${e.goals.map(g => `<a href="#" data-goal="${g.id}" style="color:#bc8cff">${g.canonical}</a>`).join(", ")}` : ""}
    </div>
    <button id="tracebtn">⟲ Trace back to earliest root</button>
    ${audioOK ? `<button id="playev">▶ play event audio</button>` : ""}
    <h3>evidence (${e.utterances.length} utterances)</h3>${utts}
    <h3>extracted (${e.mentions.length})</h3>${men || "<span style='color:var(--dim)'>none</span>"}
    <h3>edges out (${e.edges_out.length})</h3>${e.edges_out.map(edgeCard).join("") || "—"}
    <h3>edges in (${e.edges_in.length})</h3>${e.edges_in.map(edgeCard).join("") || "—"}`;
  insp.querySelector("#tracebtn").onclick = () => trace(eid);
  const pe = insp.querySelector("#playev");
  if (pe) pe.onclick = () => playEvent(eid);
  bindPlayButtons(insp);
  insp.querySelectorAll(".edgecard").forEach(c => c.onclick = () => {
    const id = c.dataset.node;
    const n = cy.getElementById(id);
    if (n.nonempty()) { cy.animate({center: {eles: n}, zoom: cy.zoom()}, {duration: 300}); inspect(id.slice(1)); }
  });
  insp.querySelectorAll("[data-goal]").forEach(a => a.onclick = ev => {
    ev.preventDefault(); showGoal(a.dataset.goal);
  });
}

async function trace(eid) {
  stopAudio();
  const d = await api(`/api/chain?event_id=${eid}`);
  cy.elements().removeClass("chain");
  const insp = $("#inspector");
  let html = `<h3>trace: event ${eid} → earliest root (${d.chain.length} hops)</h3>`;
  let prev = `e${eid}`;
  cy.getElementById(prev).addClass("chain");
  for (const h of d.chain) {
    const nid = `e${h.event_id}`;
    cy.getElementById(nid).addClass("chain");
    cy.edges().filter(e => e.data("source") === nid && e.data("target") === prev).addClass("chain");
    prev = nid;
    const quotes = h.quotes.map(q =>

async function loadThemes() {

  const acts = (lastThemes || []).filter(t => t.kind !== "social").sort(byMed);
  const socs = (lastThemes || []).filter(t => t.kind === "social").sort(byMed);
  const mk = (t, i, y0) => {

    const wp = (t.top_people || []).map(p => p[0]).filter(n => n !== "Jake").slice(0, 2);
    els.push({data: {id: "t" + t.id, type: "THEME", kind: t.kind,

                       (t.kind === "social" && wp.length ? `\nwith ${wp.join(", ")}` : ""),
                     n_events: t.n_events},
              position: {x: i * 210, y: y0 + (i % 2) * 120}});
  };
  acts.forEach((t, i) => mk(t, i, 0));
  socs.forEach((t, i) => mk(t, i, 330));
  els.push({data: {id: "band-act", type: "BANDLABEL", label: "WHAT YOU DID"},
            position: {x: -170, y: 60}, selectable: false, grabbable: false});
  els.push({data: {id: "band-soc", type: "BANDLABEL", label: "HOW IT WENT WITH PEOPLE"},
            position: {x: -170, y: 390}, selectable: false, grabbable: false});
  for (const l of lastLinks || [])
    els.push({data: {id: `tl${l.src}-${l.dst}`, source: "t" + l.src, target: "t" + l.dst,
                     relation: "THEME_LINK", n: l.n, infl: (l.by_relation || {}).INFLUENCES || 0}});
  if (cy) cy.destroy();
  cy = cytoscape({container: $("#cy"), elements: els, style,
    wheelSensitivity: 0.3, minZoom: 0.05, maxZoom: 4});
  cy.fit(undefined, 40);
  let lastTap = {id: null, t: 0};
  cy.on('tap', 'node[type="THEME"]', ev => {
    const id = ev.target.data('id'), now = Date.now();
    if (lastTap.id === id && now - lastTap.t < 400) zoomCausal(id);
    else { lastTap = {id, t: now}; showThemeCard(+id.slice(1)); }
  });
}

async function loadTheme() {
  if (!lastThemes) await fetchThemes();
  if (!curTheme || !(lastThemes || []).some(t => t.id === curTheme))
    curTheme = lastThemes && lastThemes.length ? lastThemes[0].id : null;
  const insp = $("#inspector");
  if (curTheme == null) {
    insp.innerHTML = `<p style="color:var(--dim)">no themes yet — run python -m cde.themes</p>`;
    return;
  }
  const d = await api(`/api/zoom/theme/${curTheme}`);
  const th = d.theme || {};
  $("#crumb").innerHTML = `themes › <b>${th.name || curTheme}</b>`;
  $("#crumb").style.display = "inline";
  const [lo, hi] = dayRange();
  const evNodes = d.nodes.filter(n => n.type === "EVENT" && n.day >= lo && n.day <= hi);
  const evIds = new Set(evNodes.map(n => n.id));
  const intra = d.edges.filter(e => e.relation !== "CROSS_THEME"
    && evIds.has(e.src) && evIds.has(e.dst));
  const els = buildElements({nodes: evNodes, edges: intra});
  // greedy lane packing: each event in the lowest lane whose last x is <= x - 40
  const laneX = [];
  for (const el of els.filter(e => e.position)
                     .sort((a, b) => a.position.x - b.position.x)) {
    let lane = laneX.findIndex(lx => lx <= el.position.x - 40);
    if (lane < 0) { lane = laneX.length; laneX.push(-Infinity); }
    laneX[lane] = el.position.x;
    el.position.y = lane * 40;
  }
  if (cy) cy.destroy();
  cy = cytoscape({container: $("#cy"), elements: els, style,
    wheelSensitivity: 0.3, minZoom: 0.05, maxZoom: 4});
  cy.fit(undefined, 40);
  const sp = (d.spine || []).filter(id => evIds.has("e" + id));
  sp.forEach(id => cy.getElementById("e" + id).addClass("chain"));
  for (let i = 0; i + 1 < sp.length; i++)
    cy.edges(`[source="e${sp[i]}"][target="e${sp[i + 1]}"]`).addClass("chain");
  cy.on('tap', 'node[type="EVENT"]', ev => inspect(ev.target.data('id').slice(1)));
  showThemeCard(curTheme, d);
}

// ---------- replay mode ----------
let rp = null;  // {timer, simT, nodes, pendingEdges, parent(comp), compEdges, speed}
const HOUR_MS = 1200;          // 1 sim-hour per 1.2s at speed 1
const THREAD_RELS = new Set(["SIMILAR_TO", "SAME_THREAD", "INFLUENCES", "REFERS_TO"]);

function find(x) { const p = rp.parent; while (p[x] !== x) { p[x] = p[p[x]]; x = p[x]; } return x; }

function bumpNode(id, d) {
  const n = cy.getElementById(id);
  if (n.nonempty()) n.data('mass', (n.data('mass') || 0) + d);
}

function thickenComponent(comp, amt) {
  for (const eid of rp.compEdges[comp] || []) {
    const e = cy.getElementById(eid);
    if (e.nonempty()) e.data('w', (e.data('w') || 0) + amt);
  }
}

function replayTick() {
  rp.simT += 3600 * rp.speed * (rp.tickMs / HOUR_MS);
  $("#scrub").value = (rp.simT - rp.startT) / 3600;
  const day = Math.floor(rp.simT / 86400) + 1;
  const hh = Math.floor((rp.simT % 86400) / 3600);

  const add = [];
  while (rp.ni < rp.nodes.length && rp.nodes[rp.ni].data.t <= rp.simT) {
    add.push(rp.nodes[rp.ni]); rp.ni++;
  }
  if (add.length) {
    cy.add(add);
    for (const n of add) {
      rp.parent[n.data.id] = n.data.id;
      rp.compEdges[n.data.id] = [];
      bumpNode(n.data.id, 0);
    }
  }
  const still = [];
  for (const e of rp.pendingEdges) {
    if (cy.getElementById(e.data.source).nonempty() &&
        cy.getElementById(e.data.target).nonempty()) {
      e.classes = THREAD_RELS.has(e.data.relation) && e.data.relation === "SIMILAR_TO"
        ? "replay-sim" : "";
      cy.add(e);
      const el = cy.getElementById(e.data.id);
      el.data('w', 0);
      bumpNode(e.data.source, 0.5); bumpNode(e.data.target, 0.5);
      // recurring-activity weight: joining an existing thread thickens its edges
      const s = find(e.data.source), t = find(e.data.target);
      if (THREAD_RELS.has(e.data.relation)) {
        if (s !== t) {
          const keep = (rp.compEdges[s] || []).length >= (rp.compEdges[t] || []).length ? s : t;
          const dead = keep === s ? t : s;
          rp.parent[dead] = keep;
          rp.compEdges[keep] = (rp.compEdges[keep] || []).concat(rp.compEdges[dead] || []);
          rp.compEdges[keep].push(e.data.id);
          thickenComponent(keep, 0.35);
        } else {
          // same thread seen again — heavier
          el.data('w', (el.data('w') || 0) + 0.5);
          thickenComponent(s, 0.25);
          rp.compEdges[s].push(e.data.id);
        }
      }
    } else still.push(e);
  }
  rp.pendingEdges = still;

  const ne = cy.nodes().length, ee = cy.edges().length;
  $("#clock").textContent = `Day ${day} · ${String(hh).padStart(2, "0")}:00 · ${ne} events/goals · ${ee} edges`;
  if (day !== rp.lastDay) {
    rp.lastDay = day;
    cy.animate({fit: {eles: cy.elements(), padding: 60}}, {duration: 500});
  }
  if (rp.simT >= rp.endT) stopReplay(true);
}

function startReplay() {
  if (!lastData) return;
  const els = buildElements(lastData);
  const nodes = els.filter(e => !e.data.source).sort((a, b) => a.data.t - b.data.t);
  const edges = els.filter(e => e.data.source);
  if (!nodes.length) return;
  cy.destroy();
  cy = cytoscape({container: $("#cy"), elements: [], style,
    wheelSensitivity: 0.3, minZoom: 0.05, maxZoom: 4});
  cy.on('tap', 'node[type="EVENT"]', ev => inspect(ev.target.data('id').slice(1)));
  cy.on('tap', 'node[type="GOAL"]', ev => showGoal(ev.target.data('id').slice(1)));
  rp = {simT: nodes[0].data.t - 600, startT: nodes[0].data.t - 600,
        endT: nodes[nodes.length - 1].data.t + 600,
        nodes, ni: 0, pendingEdges: edges, parent: {}, compEdges: {},
        speed: 1, tickMs: 100, lastDay: 0};
  rp.timer = setInterval(replayTick, rp.tickMs);
  $("#scrub").style.display = "inline";
  $("#btnspeed").style.display = "inline";
  $("#btnreplay").textContent = "⏸ stop";
  $("#btnreplay").classList.add("on");
}

function stopReplay(done) {
  if (rp && rp.timer) clearInterval(rp.timer);
  rp = null;
  $("#scrub").style.display = "none";
  $("#btnspeed").style.display = "none";
  $("#btnspeed").textContent = "1×";
  $("#btnreplay").textContent = "▶ replay";
  $("#btnreplay").classList.remove("on");
  $("#clock").textContent = done ? "replay complete" : "";
}

$("#btnreplay").onclick = async () => {
  if (rp) { stopReplay(false); loadGraph(); return; }
  if (lens !== "all") { setLens("all"); await loadGraph(); }
  startReplay();
};
$("#btnspeed").onclick = e => {
  if (!rp) return;
  rp.speed = {1: 2, 2: 4, 4: 1}[rp.speed] || 1;
  e.target.textContent = rp.speed + "×";
};
$("#scrub").oninput = e => {
  if (!rp) return;
  const target = rp.startT + parseFloat(e.target.value) * 3600;
  if (target < rp.simT) {   // seek backwards -> rebuild
    const els = buildElements(lastData);
    rp.nodes = els.filter(x => !x.data.source).sort((a, b) => a.data.t - b.data.t);
    rp.pendingEdges = els.filter(x => x.data.source);
    cy.elements().remove();
    rp.ni = 0; rp.parent = {}; rp.compEdges = {};
  }
  rp.simT = target; replayTick();
};

window.inspect = inspect;

dayButtons();
loadStats();
loadGraph();
loadPeopleBar();
// goal bar data comes from the full graph even though 'themes' is the default lens
api("/api/graph?subject=A1_JAKE&days=1-7").then(d => {
  if (!lastData) { lastData = d; loadGoalBar(); }
});
</script>
