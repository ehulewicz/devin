<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CDE — Jake's Social World</title>
<script src="cytoscape.min.js"></script>
<script src="trends-data.js"></script>
<style>
  :root {
    --bg:#0d1117; --panel:#161b22; --border:#30363d; --fg:#e6edf3; --dim:#8b949e;
    --accent:#f0883e; --blue:#58a6ff; --green:#3fb950; --purple:#bc8cff; --red:#f85149;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:13px/1.45 -apple-system,"Segoe UI",Roboto,sans-serif; height:100vh;
         display:flex; flex-direction:column; }
  header { padding:8px 14px; background:var(--panel); border-bottom:1px solid var(--border);
           display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:15px; margin:0; font-weight:600; }
  header .hint { color:var(--dim); font-size:12px; }
  .mbtn { background:#21262d; color:var(--fg); border:1px solid var(--border); border-radius:6px;
          padding:3px 10px; margin-right:4px; cursor:pointer; font-size:12px; }
  .mbtn.on { background:var(--accent); border-color:var(--accent); color:#0d1117; font-weight:600; }
  .mbtn.ghost { margin-left:auto; }
  a.mlink { color:var(--blue); font-size:12px; text-decoration:none; }
  main { flex:1; display:flex; min-height:0; }
  #cy { flex:1; min-width:0; }
  #inspector { width:420px; background:var(--panel); border-left:1px solid var(--border);
               overflow-y:auto; padding:14px; }
  #inspector h2 { font-size:15px; margin:0 0 4px; }
  #inspector .meta { color:var(--dim); margin-bottom:10px; font-size:12px; }
  #inspector h3 { font-size:11px; color:var(--dim); text-transform:uppercase;
                  letter-spacing:.06em; margin:16px 0 6px; }
  .statgrid { display:flex; gap:8px; flex-wrap:wrap; margin:8px 0; }
  .stat { background:#1c2128; border:1px solid var(--border); border-radius:6px;
          padding:6px 10px; font-size:12px; }
  .stat b { display:block; font-size:16px; color:var(--fg); }
  .bars { display:flex; align-items:flex-end; gap:3px; height:80px; margin:6px 0 2px; }
  .barcol { flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; position:relative; }
  .barcol .cap { width:100%; background:#30363d; border-radius:2px 2px 0 0; }
  .barcol .own { width:60%; background:var(--accent); border-radius:2px 2px 0 0; position:absolute; bottom:0; }
  .barcol:hover .cap { background:#484f58; }
  .hlabels { display:flex; gap:3px; }
  .hlabels span { flex:1; text-align:center; font-size:9px; color:var(--dim); }
  .legendrow { font-size:10px; color:var(--dim); margin-top:2px; }
  .legendrow i { display:inline-block; width:10px; height:10px; border-radius:2px;
                 vertical-align:-1px; margin-right:4px; }
  .hbar { display:flex; align-items:center; gap:6px; margin:3px 0; font-size:12px; }
  .hbar .nm { width:86px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .hbar .tr { flex:1; background:#21262d; border-radius:3px; height:12px; position:relative; }
  .hbar .fl { background:var(--blue); height:100%; border-radius:3px; }
  .hbar .fl.own { background:var(--accent); }
  .hbar .fl.green { background:var(--green); }
  .hbar .vl { width:56px; text-align:right; color:var(--dim); font-size:11px; }
  .pairrow { padding:5px 8px; border:1px solid var(--border); border-radius:6px; margin:4px 0;
             cursor:pointer; font-size:12px; display:flex; justify-content:space-between; }
  .pairrow:hover { border-color:var(--blue); }
  .pairrow .v { color:var(--accent); }
  .note { border-left:3px solid var(--accent); background:#1c2128; padding:6px 10px;
          margin:8px 0; font-size:12px; border-radius:0 6px 6px 0; }
  .note.assumed { border-left-color:var(--purple); }
  .note .tag { font-size:10px; color:var(--purple); font-weight:700; letter-spacing:.05em; }
  .backbtn { width:100%; margin-top:12px; padding:7px; background:#21262d; color:var(--fg);
             border:1px solid var(--border); border-radius:6px; cursor:pointer; font-size:12px; }
  ul.tight { margin:4px 0; padding-left:18px; font-size:12px; }
  ul.tight li { margin:3px 0; }
</style>
</head>
<body>
<header>
  <h1>Jake's Social World <span style="color:var(--dim);font-size:11px;font-weight:400">— the cognitive graph lives in Jake's head; everyone below is analysed as part of his world</span></h1>
  <span>
    edge metric:
    <button class="mbtn on" data-m="copresence">time together</button>
    <button class="mbtn" data-m="replies">replies</button>
    <button class="mbtn" data-m="exposure">hearing each other</button>
    <button class="mbtn" data-m="bond">bond (all-in-one)</button>
  </span>
  <button class="mbtn" id="fit">⤢ fit</button>
  <span id="uchips"></span>
  <span class="hint">Jake is the subject — gold ring everywhere. Pick anyone to see them through Jake's data; orbit nodes sit closer when the bond is stronger.</span>
  <a class="mlink" href="/">event graph →</a>
</header>
<main>
  <div id="cy"></div>
  <div id="inspector"><p style="color:var(--dim)">Loading…</p></div>
</main>
<script>
const D = window.TRENDS_DATA;
const $ = s => document.querySelector(s);
const WEARERS = Object.keys(D.users);                    // ["A1_JAKE", ...]
const CODE = {}, NAME = {}, COLOR = {};
const PALETTE = ["#f0883e","#58a6ff","#3fb950","#bc8cff","#e3b341","#79c0ff"];
WEARERS.forEach((w,i) => { CODE[w] = w.split("_")[0];
  NAME[w] = w[3] + w.slice(4).toLowerCase();   // A1_JAKE -> "Jake" (data uses title case)
  COLOR[w] = PALETTE[i]; });
const CODE2W = Object.fromEntries(WEARERS.map(w => [CODE[w], w]));

// ---------- pair metrics ----------
const REPLY = {};   // "A1-A4" -> {f: replies a->b, b: replies b->a} in key order
for (const e of D.reply_edges_top) {
  const wa = WEARERS.find(w => NAME[w] === e.from), wb = WEARERS.find(w => NAME[w] === e.to);
  if (!wa || !wb) continue;
  const key = [CODE[wa], CODE[wb]].sort().join("-");
  REPLY[key] = REPLY[key] || {};
  REPLY[key][CODE[wa] < CODE[wb] ? "f" : "b"] =
      (REPLY[key][CODE[wa] < CODE[wb] ? "f" : "b"] || 0) + e.replies;
}
function pairKey(wa, wb) { return [CODE[wa], CODE[wb]].sort().join("-"); }
function pairMetrics(wa, wb) {
  const k = pairKey(wa, wb), cp = D.co_presence[k] || {}, rp = REPLY[k] || {};
  const [c1, c2] = k.split("-");
  const w1 = CODE2W[c1], w2 = CODE2W[c2];
  const heard12 = (D.users[w1].speakers_heard[NAME[w2]] || 0);
  const heard21 = (D.users[w2].speakers_heard[NAME[w1]] || 0);
  const ex = (D.pair_extras || {})[k] || {};
  return { key: k, w1, w2,
           shared: cp.shared_utterances || 0, span: cp.span_hours || 0,
           first: cp.first, last: cp.last,
           r12: rp.f || 0, r21: rp.b || 0,
           heard12, heard21,
           lat1: ex.lat_f, lat2: ex.lat_b,          // reply latency, each member
           ov1: ex.ov_f || 0, ov2: ex.ov_b || 0,    // talk-overs committed
           n1: ex.n_f || 0, n2: ex.n_b || 0,        // clean replies (denominator)
           replies: (rp.f || 0) + (rp.b || 0),
           exposure: heard12 + heard21 };
}
const PAIRS = [];
for (let i = 0; i < WEARERS.length; i++)
  for (let j = i + 1; j < WEARERS.length; j++)
    PAIRS.push(pairMetrics(WEARERS[i], WEARERS[j]));

const METRICS = {
  copresence: { get: p => p.shared,  label: "time together (shared moments)", fmt: v => v },
  replies:    { get: p => p.replies, label: "replies",                        fmt: v => v },
  exposure:   { get: p => p.exposure,label: "heard each other",               fmt: v => v },
  bond:       { get: p => p.bond,    label: "bond strength",                  fmt: v => v + "/100" },
};
let metric = "copresence";
const maxFor = m => Math.max(...PAIRS.map(METRICS[m].get), 1);   // floor 1: no 0/0 norms

// bond = blend of the three signals, 0–100; connectedness = a user's avg bond
const [mxCp, mxRp, mxEx] = [maxFor("copresence"), maxFor("replies"), maxFor("exposure")];
for (const p of PAIRS)
  p.bond = Math.round(100 * (p.shared/mxCp + p.replies/mxRp + p.exposure/mxEx) / 3);
const userBond = w => {
  const rels = PAIRS.filter(p => p.w1 === w || p.w2 === w);
  return Math.round(rels.reduce((s, p) => s + p.bond, 0) / rels.length);
};

// ---------- plain-English per-user summaries ----------
function profile(w) {
  const u = D.users[w];
  const share = u.own_utterances / u.utterances_captured;
  const rels = PAIRS.filter(p => p.w1 === w || p.w2 === w).sort((a, b) => b.bond - a.bond);
  const best = rels[0], worst = rels[rels.length - 1];
  const other = p => p.w1 === w ? p.w2 : p.w1;
  const ov = userOvRate(w), end = u.active_span_hours[1];
  const s = [
    share >= 0.30 ? `Talks a lot — ${Math.round(100*share)}% of their recording is their own voice.`
      : share < 0.21 ? `The quiet one — only ${Math.round(100*share)}% of their recording is their own voice.`
      : `Moderately talkative (${Math.round(100*share)}% of the recording is them).`,
    `Closest to ${NAME[other(best)]} — bond ${best.bond}/100.`,
    `Furthest from ${NAME[other(worst)]} — bond ${worst.bond}/100.`,
    ov > 0.40 ? `Jumps in early — ${Math.round(100*ov)}% of their replies start before the other person finishes.`
      : ov < 0.28 ? `Rarely talks over people — only ${Math.round(100*ov)}% of replies overlap.`
      : `Talks over people about as often as the group average (${Math.round(100*ov)}%).`,
    `Recording ends around ${Math.round(end)}:00${end < 21 ? " — earlier than the group's ~22:00 wind-down" : ""}.`,
  ];
  if (u.monologue_max >= 35)
    s.push(`Holds the floor — longest unbroken streak in the group (${u.monologue_max} utterances).`);
  return s;
}
function roleTag(w) {
  const rank = WEARERS.slice().sort((a,b) => userBond(b) - userBond(a)).indexOf(w);
  const u = D.users[w], share = u.own_utterances / u.utterances_captured;
  if (rank === 0) return "the hub — connected to everyone";
  if (share < 0.21) return "the quiet center — always there, rarely heard";
  if (u.active_span_hours[1] < 21) return "the early leaver";
  if (rank === WEARERS.length - 1) return "the outlier — weakest ties overall";
  return "a steady member of the group";
}

// ---------- narratives (from analysis/TRENDS.md) ----------
const NOTES = {
  A1_JAKE: [
    "The most social person here — everyone recorded him, and in Alice's and Tasha's recordings he shows up more than they do themselves.",
    "People talk to him more than he starts talking to them — consistent with someone everyone comes to for plans.",
    "Awake and recording latest (past 22:00); busiest mid-morning and again 5–8pm."],
  A2_ALICE: [
    "Spends the most time physically with others but talks the least — she's around constantly, just quiet.",
    "Her closest relationship is Tasha: they were side by side ~9.5 hours and rarely interrupt each other.",
    "Because she's quiet, she barely shows up in conversations — but her recordings prove she was there."],
  A3_TASHA: [
    "Alice's closest companion, and a bridge to Lucia and Katrina — friendly with everybody.",
    "No weak ties: every one of her relationships lands in the middle or higher.",
    "Leaves earlier than the main group — recording stops ~20:45."],
  A4_LUCIA: [
    "Jake's #1 conversation partner — they reply to each other more than any other pair (3,684 exchanges).",
    "The second-most-heard voice in everyone's recordings.",
    "Close with Katrina, Tasha and Alice too — not just 'Jake's partner'."],
  A5_KATRINA: [
    "Middle of the group on everything — no strongest or weakest relationship.",
    "Recorded the least overall and had the emptiest afternoon (almost nothing 1–3pm).",
    "That afternoon gap looks like personal downtime, not a group event."],
  A6_SHURE: [
    "Leaves the group every evening ~6:37pm, though his recorder keeps going until ~10pm.",
    "Has a private social life nobody else sees — 'Shure's girlfriend' and 'Sister' appear only in his recording.",
    "5pm is the loudest hour anyone recorded (2,144 utterances — a big group moment he's in).",
    "When he does talk, he keeps going — the group's longest unbroken streak (42 utterances)."],
};
const ASSUMED = {
  A1_JAKE: "He probably stays the organizer all week — the plans he starts early (the party, the barbecue, the schedule changes) are what later events keep tracing back to.",
  A2_ALICE: "She likely stays Tasha's quiet partner all week — present at shared moments, easy to miss because she rarely speaks.",
  A3_TASHA: "The Alice–Tasha pairing probably holds all week; expect her early nights to repeat.",
  A4_LUCIA: "She probably keeps co-running things with Jake — the mid-week replanning (grill rehearsal, BBQ reschedule) reads like shared logistics.",
  A5_KATRINA: "She probably stays a steady mid-level member; quiet afternoons like day 1's may recur.",
  A6_SHURE: "Expect the evening exits and the girlfriend/sister thread to keep repeating — he lives a second social life the group doesn't see.",
};
// how the Jake-only cognitive graph biases what we can say about each person
const JAKEY = {
  A1_JAKE: "This is Jake's head: every event, goal and 'influence' link is something his own recorder heard — blind spots exist wherever he wasn't present.",
  A2_ALICE: "Through Jake's ears Alice is easy to underestimate — she's next to him constantly but speaks little, and anything she said outside his earshot never reached the graph.",
  A3_TASHA: "Jake sees Tasha as a solid mid-tier partner — but her deepest bond is with Alice, and much of it happens where Jake can't hear, so his view understates it.",
  A4_LUCIA: "Lucia may look more central than she is — she's next to Jake so often that his graph records almost everything she does with the group.",
  A5_KATRINA: "Katrina looks peripheral partly because Jake shares less time with her — her own recording shows a steadier member than Jake's view implies.",
  A6_SHURE: "Shure's evenings (~18:37 on) are a blind spot — Jake's recorder can't corroborate the girlfriend/sister thread, so treat Shure's presence here as a floor, not a ceiling.",
};

// ---------- graph ----------
let cy, curUser = "A1_JAKE";         // Jake's perspective by default; null = group mesh
const maxOwn = Math.max(...WEARERS.map(w => D.users[w].own_utterances));

const CY_STYLE = [
  { selector: "node", style: {
      "background-color": n => COLOR[n.data("wearer")],
      "width": n => (n.data("hub") ? 90 : 20 + 34 * (n.data("own") / maxOwn)) * (n.data("subject") ? 1.35 : 1),
      "height": n => (n.data("hub") ? 90 : 20 + 34 * (n.data("own") / maxOwn)) * (n.data("subject") ? 1.35 : 1),
      "label": n => n.data("name") + "\n" + n.data("own") + " utts",
      "color": "#e6edf3", "font-size": 11, "text-valign": "bottom",
      "text-margin-y": 5, "text-wrap": "wrap", "text-max-width": "90px",
      "border-width": 0 }},
  { selector: "node[?hub]", style: {
      "font-size": 15, "font-weight": 700, "border-width": 4,
      "border-color": "#ffd33d" }},
  { selector: "node[?subject]", style: {   // Jake: gold ring in every view
      "border-width": 4, "border-color": "#ffd33d", "font-weight": 700 }},
  { selector: "edge", style: {
      "width": e => 1 + 11 * e.data("norm"),
      "line-color": "#3d444d", "opacity": 0.75,
      "curve-style": "bezier",
      "label": e => METRICS[metric].fmt(e.data("v")),
      "font-size": 10, "color": "#e6edf3", "text-opacity": 0,
      "text-background-color": "#0d1117", "text-background-opacity": 0.85,
      "text-background-padding": 2 }},
  { selector: "edge[?ego]", style: { "text-opacity": 1, "font-size": 12 }},
  { selector: ".faded", style: { "opacity": 0.12 }},
  { selector: "edge.hi", style: { "line-color": "#f0883e", "opacity": 1 }},
  { selector: "node.hi", style: { "border-width": 3, "border-color": "#ffd33d" }},
];

function buildGraph() {
  const mx = maxFor(metric);
  const els = [];
  if (!curUser) {
    // group mesh: everyone equal, force layout clusters strong pairs together
    for (const w of WEARERS) {
      const u = D.users[w];
      els.push({ data: { id: CODE[w], name: NAME[w], wearer: w,
                         own: u.own_utterances, captured: u.utterances_captured,
                         subject: w === "A1_JAKE" ? 1 : 0 }});
    }
    for (const p of PAIRS) {
      const v = METRICS[metric].get(p);
      els.push({ data: { id: "p" + p.key, source: CODE[p.w1], target: CODE[p.w2],
                         pair: p.key, v, norm: v / mx }});
    }
  } else {
    // ego star: hub big at origin; satellites ring it, distance inverts strength
    const hub = D.users[curUser];
    els.push({ data: { id: CODE[curUser], name: NAME[curUser], wearer: curUser,
                       own: hub.own_utterances, captured: hub.utterances_captured,
                       hub: 1, subject: curUser === "A1_JAKE" ? 1 : 0 },
               position: { x: 0, y: 0 }});
    const others = WEARERS.filter(w => w !== curUser);
    others.forEach((w, i) => {
      const p = pairMetrics(curUser, w);
      const v = METRICS[metric].get(p), norm = v / mx;
      const ang = (i / others.length) * 2 * Math.PI - Math.PI / 2;
      const rad = 460 - 300 * norm;                    // stronger -> closer to hub
      const u = D.users[w];
      els.push({ data: { id: CODE[w], name: NAME[w], wearer: w,
                         own: u.own_utterances, captured: u.utterances_captured,
                         norm, subject: w === "A1_JAKE" ? 1 : 0 },
                 position: { x: rad * Math.cos(ang), y: rad * Math.sin(ang) }});
      els.push({ data: { id: "p" + p.key, source: CODE[curUser], target: CODE[w],
                         pair: p.key, v, norm, ego: 1 }});
    });
  }
  if (cy) cy.destroy();
  cy = cytoscape({
    container: $("#cy"), elements: els, wheelSensitivity: 0.25,
    minZoom: 0.3, maxZoom: 5,
    layout: curUser ? { name: "preset" }
                    : { name: "cose", animate: false, nodeRepulsion: 9000,
                        idealEdgeLength: e => 220 - 140 * e.data("norm"),
                        edgeElasticity: 50 },
    style: CY_STYLE,
  });
  cy.fit(undefined, curUser ? 110 : 60);
  cy.on("zoom", () => {
    if (curUser) return;                               // ego labels always on
    const t = cy.zoom() > 0.75 ? 1 : 0;
    cy.edges().forEach(e => { if (e.style("text-opacity") != t) e.style("text-opacity", t); });
  });
  cy.on("tap", "node", ev => focusNode(ev.target));
  cy.on("tap", "edge", ev => focusEdge(ev.target));
  cy.on("tap", ev => { if (ev.target === cy) resetView(); });
}

function setUser(w) {
  curUser = w;
  document.querySelectorAll(".uchip").forEach(b =>
    b.classList.toggle("on", b.dataset.u === (w || "")));
  buildGraph();
  if (w) showUser(w); else showOverview();
}

// user chips in header
(() => {
  const box = $("#uchips");
  const all = document.createElement("button");
  all.textContent = "group"; all.className = "mbtn uchip"; all.dataset.u = "";
  all.onclick = () => setUser(null);
  box.appendChild(all);
  const jb = document.createElement("button");            // Jake first, starred
  jb.textContent = "★ Jake"; jb.className = "mbtn uchip"; jb.dataset.u = "A1_JAKE";
  jb.style.borderColor = COLOR.A1_JAKE; jb.style.fontWeight = "700";
  jb.onclick = () => setUser("A1_JAKE");
  box.appendChild(jb);
  for (const w of WEARERS) {
    if (w === "A1_JAKE") continue;
    const b = document.createElement("button");
    b.textContent = NAME[w]; b.className = "mbtn uchip"; b.dataset.u = w;
    b.style.borderColor = COLOR[w];
    b.onclick = () => setUser(w);
    box.appendChild(b);
  }
})();

function setMetric(m) {
  metric = m;
  document.querySelectorAll(".mbtn[data-m]").forEach(b =>
    b.classList.toggle("on", b.dataset.m === m));
  buildGraph();                       // ego positions depend on the metric — rebuild
  if (curUser) showUser(curUser); else showOverview();
}
document.querySelectorAll(".mbtn[data-m]").forEach(b => b.onclick = () => setMetric(b.dataset.m));
$("#fit").onclick = () => { cy.animate({ fit: { padding: 60 } }, { duration: 300 }); };

// ---------- focus / detail ----------
function hilite(eles) {
  cy.elements().addClass("faded").removeClass("hi");
  eles.removeClass("faded").addClass("hi");
}
function resetView() {
  cy.elements().removeClass("faded hi");
  cy.animate({ fit: { padding: curUser ? 110 : 60 } }, { duration: 300 });
  if (curUser) showUser(curUser); else showOverview();
}
function focusNode(n) {
  if (curUser && !n.data("hub")) {
    // ego mode: tapping an orbit node zooms into that pair link
    const e = cy.edges().filter(x => x.connectedNodes().contains(n))[0];
    if (e.nonempty()) { focusEdge(e); return; }
  }
  const hood = n.closedNeighborhood();
  hilite(hood);
  cy.animate({ fit: { eles: hood, padding: 90 } }, { duration: 400 });
  showUser(n.data("wearer"));
}
function focusEdge(e) {
  const g = e.union(e.connectedNodes());
  hilite(g);
  cy.animate({ fit: { eles: g, padding: 140 } }, { duration: 400 });
  const [w1, w2] = e.data("pair").split("-").map(c => CODE2W[c]);
  showPair(pairMetrics(w1, w2));
}

// ---------- inspector renderers ----------
function bar(u) {
  const hrs = u.hourly;
  const hs = Object.keys(hrs).map(Number).sort((a,b)=>a-b);
  const lo = hs[0], hi = hs[hs.length-1];
  const mx = Math.max(...hs.map(h => hrs[h].captured));
  let cols = "", labs = "";
  for (let h = lo; h <= hi; h++) {
    const c = hrs[h] ? hrs[h].captured : 0, o = hrs[h] ? hrs[h].own : 0;
    cols += `<div class="barcol" title="${h}:00 — ${c} captured, ${o} own">
      <div class="cap" style="height:${Math.round(76*c/mx)}px"></div>
      <div class="own" style="height:${Math.round(76*o/mx)}px"></div></div>`;
    labs += `<span>${h}</span>`;
  }
  return `<div class="bars">${cols}</div><div class="hlabels">${labs}</div>
    <div class="legendrow"><i style="background:#30363d"></i>captured around wearer
    <i style="background:var(--accent);margin-left:10px"></i>wearer's own speech</div>`;
}
function hbars(items, cls) {
  const mx = Math.max(...items.map(x => x[1]), 1);
  return items.map(([nm, v]) =>
    `<div class="hbar"><span class="nm">${nm}</span>
     <span class="tr"><span class="fl ${cls||""}" style="width:${Math.round(100*v/mx)}%"></span></span>
     <span class="vl">${v}</span></div>`).join("");
}
function pairTable(sortKey) {
  return PAIRS.slice().sort((a,b) => METRICS[metric].get(b) - METRICS[metric].get(a))
    .map(p => `<div class="pairrow" data-p="${p.key}">
      <span>${NAME[p.w1]} ⇄ ${NAME[p.w2]}</span>
      <span class="v">${METRICS[metric].fmt(METRICS[metric].get(p))}</span></div>`).join("");
}
function bindPairRows() {
  document.querySelectorAll(".pairrow").forEach(r => r.onclick = () => {
    const e = cy.getElementById("p" + r.dataset.p);
    if (e.nonempty()) focusEdge(e);
  });
}

function groupRhythm() {
  const acc = {};
  for (const w of WEARERS)
    for (const [h, v] of Object.entries(D.users[w].hourly)) {
      acc[h] = acc[h] || [0,0]; acc[h][0] += v.captured; acc[h][1] += v.own;
    }
  return bar({ hourly: acc });
}

function showOverview() {
  const byBond = PAIRS.slice().sort((a,b) => b.bond - a.bond);
  const best = byBond[0];
  const patient = PAIRS.slice().sort((a,b) =>
    (ovRate(a.ov1,a.n1)+ovRate(a.ov2,a.n2)) - (ovRate(b.ov1,b.n1)+ovRate(b.ov2,b.n2)))[0];
  const early = PAIRS.filter(p => p.span < 8);
  const earlyWearers = [...new Set(early.flatMap(p => [p.w1, p.w2]))];
  const talkiest = WEARERS.slice().sort((a,b) => userOvRate(b) - userOvRate(a))[0];
  const mostVoiced = WEARERS.slice().sort((a,b) => D.users[b].voiced_s - D.users[a].voiced_s)[0];
  const roster = WEARERS.slice().sort((a,b) => userBond(b) - userBond(a));
  $("#inspector").innerHTML = `
    <h2>Group overview — day 1</h2>
    <div class="meta">6 wearers · ${Object.values(D.users).reduce((s,u)=>s+u.utterances_captured,0).toLocaleString()}
      utterances recorded · edge metric: <b>${METRICS[metric].label}</b></div>
    <div class="note" style="border-left-color:#ffd33d"><b>★ Jake is the subject.</b>
      The cognitive engine models the week from Jake's head — events, plans and
      influences are what his recorder heard. Everyone else's recordings serve as
      supporting evidence: how the people around Jake actually behaved. Anything
      that happened away from Jake's mic is invisible to his graph.</div>
    <h3>who's who</h3>
    ${roster.map(w => `<div class="pairrow" data-u="${w}">
      <span style="color:${COLOR[w]}"><b>${NAME[w]}</b> — ${roleTag(w)}</span>
      <span class="v">${userBond(w)}/100</span></div>`).join("")}
    <h3>group rhythm (all wearers)</h3>
    ${groupRhythm()}
    <div class="note">Everyone's recording goes quiet ~14:30–17:00 — a scheduled break, not six
      coincidences. Loud group block 17–19, tapering after 20:00.</div>
    <h3>pairs by ${METRICS[metric].label}</h3>
    ${pairTable()}
    <div class="note">Strongest bond: <b>${NAME[best.w1]} ⇄ ${NAME[best.w2]}</b>
      (${best.bond}/100 blended, ${best.shared.toLocaleString()} shared moments over ${best.span}h).</div>
    <div class="note">Most patient pair: <b>${NAME[patient.w1]} ⇄ ${NAME[patient.w2]}</b> —
      ${Math.round(100*ovRate(patient.ov1,patient.n1))}%/${Math.round(100*ovRate(patient.ov2,patient.n2))}%
      of their replies overlap vs ${Math.round(100*PAIRS.reduce((s,p)=>s+(ovRate(p.ov1,p.n1)+ovRate(p.ov2,p.n2))/2,0)/PAIRS.length)}%
      group average.</div>
    ${early.length ? `<div class="note">${earlyWearers.map(w=>NAME[w]).join(" and ")}
      ${earlyWearers.length === 1 ? "leaves" : "leave"} the group early — every pair involving them
      ends ~${Math.round(Math.max(...early.map(p=>p.last)))}:30 while other recordings run past 20:00.</div>` : ""}
    <div class="note"><b>${NAME[mostVoiced]}</b> talks the most
      (${Math.round(D.users[mostVoiced].voiced_s/60)} min of own speech) ·
      <b>${NAME[talkiest]}</b> interrupts most
      (${Math.round(100*userOvRate(talkiest))}% of replies).</div>
    <div class="note assumed"><span class="tag">ASSUMED · WEEK</span><br>
      In the extracted week-graph, 9 judged cause-ish links, 299 same-thread links and 163 recurring
      goals survive — most radiate from plans Jake made early, so the group's threads likely stay
      organized around him.</div>`;
  bindPairRows();
  document.querySelectorAll(".pairrow[data-u]").forEach(r =>
    r.onclick = () => setUser(r.dataset.u));
}

function showUser(w) {
  const u = D.users[w];
  const share = Math.round(100 * u.own_utterances / u.utterances_captured);
  const heard = Object.entries(u.speakers_heard)
    .filter(([n]) => n !== NAME[w]).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const rels = PAIRS.filter(p => p.w1 === w || p.w2 === w)
    .sort((a,b) => METRICS[metric].get(b) - METRICS[metric].get(a));
  const heardMax = heard.length ? heard[0][1] : 1;
  $("#inspector").innerHTML = `
    <h2 style="color:${COLOR[w]}">${NAME[w]}${w === "A1_JAKE" ? ' <span style="color:#ffd33d">★ subject</span>' : ""} <span style="color:var(--dim);font-size:12px">${w}</span></h2>
    <div class="meta">${roleTag(w)} · day 1 · active ${u.active_span_hours[0]}:00–${u.active_span_hours[1]}:00
      ${w !== "A1_JAKE" ? " · <i>as seen through Jake's data</i>" : ""}</div>
    <div class="statgrid">
      <div class="stat"><b>${userBond(w)}/100</b>connectedness</div>
      <div class="stat"><b>${u.utterances_captured.toLocaleString()}</b>captured</div>
      <div class="stat"><b>${u.own_utterances.toLocaleString()}</b>own speech</div>
      <div class="stat"><b>${share}%</b>self-share</div>
      <div class="stat"><b>${Math.round(u.voiced_s/60)}m</b>airtime${D.audio_vad ? " (VAD)" : ""}</div>
      <div class="stat"><b>${u.monologue_max}</b>longest streak</div>
      <div class="stat"><b>${Math.round(100*userOvRate(w))}%</b>talk-over rate</div>
    </div>
    <h3>in plain words</h3>
    <ul class="tight">${profile(w).map(s => `<li>${s}</li>`).join("")}</ul>
    <h3>hourly activity</h3>
    ${bar(u)}
    <h3>voices in their day</h3>
    ${hbars(heard)}
    <h3>relationships — by ${METRICS[metric].label}</h3>
    ${rels.map(p => {
      const other = p.w1 === w ? p.w2 : p.w1;
      const v = METRICS[metric].get(p);
      return `<div class="pairrow" data-p="${p.key}">
        <span style="color:${COLOR[other]}">⇄ ${NAME[other]}</span>
        <span class="v">${METRICS[metric].fmt(v)}</span></div>`;
    }).join("")}
    <h3>what stands out</h3>
    <ul class="tight">${NOTES[w].map(n => `<li>${n}</li>`).join("")}</ul>
    <div class="note assumed"><span class="tag">GUESS FOR THE WEEK</span><br>${ASSUMED[w]}</div>
    <div class="note assumed" style="border-left-color:var(--red)">
      <span class="tag" style="color:var(--red)">JAKE'S-VIEW BIAS</span><br>${JAKEY[w]}</div>
    <button class="backbtn" onclick="setUser(null)">← group view</button>`;
  bindPairRows();
}

const ovRate = (ov, n) => n + ov ? ov / (n + ov) : 0;
const userOvRate = w => {   // talk-overs committed / all that member's exchanges
  let ov = 0, n = 0;
  for (const p of PAIRS) {
    if (p.w1 === w) { ov += p.ov1; n += p.n1 + p.ov1; }
    if (p.w2 === w) { ov += p.ov2; n += p.n2 + p.ov2; }
  }
  return n ? ov / n : 0;
};

function showPair(p) {
  const rTot = p.r12 + p.r21 || 1, hTot = p.heard12 + p.heard21 || 1;
  const spanNote = p.span < 8
    ? `<div class="note">They only overlapped ${p.span}h, ending ~${p.last} — the group's
       typical pair runs ~10.9h, so one of them peeled off early.</div>` : "";
  const rank = 1 + PAIRS.slice().sort((a,b)=>b.bond-a.bond).findIndex(x=>x.key===p.key);
  $("#inspector").innerHTML = `
    <h2><span style="color:${COLOR[p.w1]}">${NAME[p.w1]}</span> ⇄
        <span style="color:${COLOR[p.w2]}">${NAME[p.w2]}</span></h2>
    <div class="meta">pair detail · day 1 · bond rank #${rank} of 15</div>
    <div class="statgrid">
      <div class="stat"><b>${p.bond}/100</b>bond</div>
      <div class="stat"><b>${p.shared.toLocaleString()}</b>shared moments</div>
      <div class="stat"><b>${p.span}h</b>together ${p.first}–${p.last}</div>
    </div>
    <h3>exchanges — speaker → responder</h3>
    <div class="hbar"><span class="nm">${NAME[p.w1]} → ${NAME[p.w2]}</span>
      <span class="tr"><span class="fl" style="width:${Math.round(100*p.r12/rTot)}%"></span></span>
      <span class="vl">${p.r12}</span></div>
    <div class="hbar"><span class="nm">${NAME[p.w2]} → ${NAME[p.w1]}</span>
      <span class="tr"><span class="fl own" style="width:${Math.round(100*p.r21/rTot)}%"></span></span>
      <span class="vl">${p.r21}</span></div>
    <h3>how much of each other's day each heard</h3>
    <div class="hbar"><span class="nm">${NAME[p.w1]} heard</span>
      <span class="tr"><span class="fl green" style="width:${Math.round(100*p.heard12/hTot)}%"></span></span>
      <span class="vl">${p.heard12}</span></div>
    <div class="hbar"><span class="nm">${NAME[p.w2]} heard</span>
      <span class="tr"><span class="fl green" style="width:${Math.round(100*p.heard21/hTot)}%"></span></span>
      <span class="vl">${p.heard21}</span></div>
    <h3>timing — how fast they reply &amp; who jumps in</h3>
    <div class="hbar"><span class="nm">${NAME[p.w1]} replies</span>
      <span class="tr"><span class="fl" style="width:${Math.round(100*(p.lat1||0)/3)}%"></span></span>
      <span class="vl">${p.lat1 != null ? p.lat1 + "s" : "—"}</span></div>
    <div class="hbar"><span class="nm">${NAME[p.w2]} replies</span>
      <span class="tr"><span class="fl own" style="width:${Math.round(100*(p.lat2||0)/3)}%"></span></span>
      <span class="vl">${p.lat2 != null ? p.lat2 + "s" : "—"}</span></div>
    <div class="hbar"><span class="nm">${NAME[p.w1]} talks over</span>
      <span class="tr"><span class="fl green" style="width:${Math.round(100*ovRate(p.ov1,p.n1))}%"></span></span>
      <span class="vl">${Math.round(100*ovRate(p.ov1,p.n1))}%</span></div>
    <div class="hbar"><span class="nm">${NAME[p.w2]} talks over</span>
      <span class="tr"><span class="fl green" style="width:${Math.round(100*ovRate(p.ov2,p.n2))}%"></span></span>
      <span class="vl">${Math.round(100*ovRate(p.ov2,p.n2))}%</span></div>
    <div class="legendrow">latency = typical wait before replying (transcript time
      is rounded to whole seconds, so 1.0s is the floor) · talk-over = started
      talking before the other finished (${p.ov1 + p.ov2} times)</div>
    ${spanNote}
    <div class="note">Every recorder nearby captures the same exchange, so reply counts
      are inflated ~3–4× — compare the two directions against each other, not the raw totals.</div>
    <button class="backbtn" onclick="resetView()">← back to ${curUser ? NAME[curUser] : "group"}</button>
    <button class="backbtn" style="border-color:${COLOR[p.w1]}" onclick="setUser('${p.w1}')">◉ center on ${NAME[p.w1]}</button>
    <button class="backbtn" style="border-color:${COLOR[p.w2]}" onclick="setUser('${p.w2}')">◉ center on ${NAME[p.w2]}</button>`;
}

buildGraph();
resetView();
</script>
</body>
</html>
